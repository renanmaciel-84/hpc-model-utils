[project]
name = "hpc-model-utils"
version = "2.2.3"
description = "CLI tool for running energy planning models (NEWAVE, DECOMP, cobre) in HPC clusters with SLURM and AWS S3 integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Mariana Noel", email = "marianasimoesnoel@gmail.com" },
  { name = "Rogerio Alves", email = "rogerioalves.ee@gmail.com" },
]
keywords = ["hpc", "newave", "decomp", "cobre", "slurm", "s3", "cli", "energy-models"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "boto3>=1.43",
  "botocore>=1.43",
  "cfinterface>=1.10.1",
  "click>=8.4",
  "idecomp>=1.11.0",
  "inewave>=1.14.1",
  "pyarrow>=22",
]

[project.urls]
Homepage = "https://github.com/rjmalves/hpc-model-utils"
Repository = "https://github.com/rjmalves/hpc-model-utils"
Issues = "https://github.com/rjmalves/hpc-model-utils/issues"

[project.scripts]
hpc-model-utils = "hpc_model_utils.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/hpc_model_utils"]
sources = ["src"]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.43",
  "hypothesis>=6.100",
  "mypy",
  "pytest",
  "pytest-cov>=7.1",
  "pytest-timeout>=2.4",
  "requests>=2.34",
  "ruff>=0.15",
]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "S602", "S604", "S605"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
  "integration: Integration tests requiring LocalStack (deselect with '-m \"not integration\"')",
  "slow: Slow tests that may take longer to run",
]
timeout = 300
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--strict-markers",
  "--tb=short",
]
